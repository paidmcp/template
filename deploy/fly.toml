app = "your-paid-mcp"
primary_region = "mad"

[build]
  dockerfile = "deploy/Dockerfile"

[http_service]
  internal_port = 4021
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[mounts]
  source = "data"
  destination = "/app/data"

[env]
  DB_PATH = "/app/data/paidmcp.db"
  # Fly's proxy sits in front of the app; needed for per-client trial limits.
  TRUST_PROXY = "1"
